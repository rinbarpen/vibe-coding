name: Research Idea
description: 提交一个新的研究方向或课题想法
title: "[Idea]: "
labels: ["research-idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 研究问题
      description: 你要解决什么核心问题？
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: 建议方法
      description: 你打算怎么解决？
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景与相关工作
      description: 已有工作和现状

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 希望达到什么效果？

  - type: textarea
    id: refs
    attributes:
      label: 参考文献
      description: 关键参考论文链接或 DOI
