name: Figure Request
description: 提交论文图表生成请求
title: "[Figure]: "
labels: ["auto-figure"]
body:
  - type: dropdown
    id: figure_type
    attributes:
      label: 图表类型
      options:
        - architecture（架构图）
        - workflow（工作流图）
        - result（结果图）
        - illustration（插图）
        - comparison（对比图）
      validations:
        required: true

  - type: textarea
    id: description
    attributes:
      label: 图表描述
      description: 清晰描述图表需要展示的内容
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: 数据源
      description: 如果结果图，数据来自哪里？

  - type: input
    id: style
    attributes:
      label: 风格参考
      description: 参考论文或风格描述（可选）
