name: Feature Request
description: 提出新功能建议
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解决了什么问题
      description: 请描述你遇到的使用场景或痛点
      placeholder: 当...的时候，我感到不便，因为...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 你希望看到什么？
      placeholder: 我希望新增一个...功能
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你考虑过哪些变通方法或替代方案？
      placeholder: 目前我用...来绕过这个问题，但是...

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 什么样的结果才算满足需求？
      placeholder: |
        - [ ] 用户可以...
        - [ ] 系统会...

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - API
        - Frontend
        - Database
        - Documentation
        - Infrastructure
        - Security
        - Performance
        - Other
