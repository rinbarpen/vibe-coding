name: Release Branch

on:
  push:
    branches:
      - "release/v*"

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract version from branch
        id: version
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          VERSION=${BRANCH#release/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release branch: $BRANCH → version $VERSION"
      - name: Check CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if grep -q "^## \[${VERSION#v}\]" CHANGELOG.md 2>/dev/null; then
            echo "✓ CHANGELOG entry exists for $VERSION"
          else
            echo "! CHANGELOG entry missing for $VERSION — will create"
          fi

  rc-deploy:
    needs: version-bump
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Build for RC
        run: |
          pip install build
          python -m build
      - name: Deploy to staging
        run: |
          echo "Deploying release candidate ${{ steps.version.outputs.version }} to staging"
          # Add your actual deploy steps here
      - name: RC summary
        run: |
          echo "## Release Candidate" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "Environment: staging" >> $GITHUB_STEP_SUMMARY
