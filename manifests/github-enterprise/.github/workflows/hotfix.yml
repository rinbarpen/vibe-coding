name: Hotfix

on:
  push:
    branches:
      - "hotfix/v*"

jobs:
  urgent-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract version
        id: version
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          VERSION=${BRANCH#hotfix/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
      - name: Quick lint
        run: ruff check --output-format=github .
      - name: Run critical tests
        run: pytest --timeout=60 -x -q

  build-and-deploy:
    needs: urgent-ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Deploy hotfix
        run: |
          echo "Deploying hotfix ${{ needs.urgent-ci.outputs.version }} to production"
          # Add your actual deploy steps here

  tag:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create hotfix tag
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          VERSION=${BRANCH#hotfix/}
          # Find existing hotfix count
          COUNT=$(git tag -l "${VERSION}-hotfix.*" | wc -l)
          HOTFIX_TAG="${VERSION}-hotfix.$((COUNT + 1))"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -a "$HOTFIX_TAG" -m "Hotfix $HOTFIX_TAG"
          git push origin "$HOTFIX_TAG"
          echo "tag=$HOTFIX_TAG" >> $GITHUB_OUTPUT

  changelog:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update CHANGELOG
        run: |
          VERSION="${{ github.ref_name }}"
          DATE=$(date +%Y-%m-%d)
          # Insert hotfix entry after Unreleased
          sed -i "/^## \[Unreleased\]/a\\\n## [${VERSION#v}] - $DATE\n\n### Fixed\n- Hotfix ${VERSION}\n" CHANGELOG.md
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG for hotfix $VERSION"
          git push
