name: Epic / Initiative
description: 跨 sprints 的大型工作项
title: "[Epic]: "
labels: ["epic"]
body:
  - type: textarea
    id: objective
    attributes:
      label: 目标
      description: 这个 epic 要实现什么？
    validations:
      required: true

  - type: textarea
    id: metrics
    attributes:
      label: 成功指标
      description: 如何衡量是否成功？
      placeholder: |
        - 指标一：目标值
        - 指标二：目标值

  - type: textarea
    id: scope
    attributes:
      label: 范围
      description: 包含和不包含的内容
      placeholder: |
        ## 包含
        - ...

        ## 不包含
        - ...

  - type: textarea
    id: milestones
    attributes:
      label: 里程碑
      description: 关键里程碑和时间节点
      placeholder: |
        - [ ] M1: 基础功能完成
        - [ ] M2: 集成测试通过
        - [ ] M3: 上线发布

  - type: textarea
    id: dependencies
    attributes:
      label: 依赖项
      description: 依赖的 epic、项目或外部因素

  - type: input
    id: timeline
    attributes:
      label: 目标日期
      description: 预期的完成时间
      placeholder: "2025-Q3"
