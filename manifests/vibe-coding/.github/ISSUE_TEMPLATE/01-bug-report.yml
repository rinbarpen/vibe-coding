name: Bug Report
description: 提交 Bug 帮助改进项目
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Bug 描述
      description: 清晰简洁地描述这个 bug 是什么
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      description: 这个问题有多严重？
      options:
        - critical（系统崩溃/数据丢失/安全漏洞）
        - major（主要功能不可用）
        - minor（次要功能异常/体验问题）
        - trivial（拼写错误/UI 微调）
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 你使用的是哪个版本？
      placeholder: "v1.2.3"

  - type: dropdown
    id: environment
    attributes:
      label: 环境
      options:
        - 生产环境
        - 测试环境
        - 本地开发

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何复现这个 bug？
      placeholder: |
        1. 打开 '...'
        2. 点击 '....'
        3. 看到错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 如果适用，添加日志或截图帮助说明问题
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已经搜索了已有的 issue，没有找到重复的
          required: true
        - label: 我提供了最小复现步骤
          required: true
        - label: 我提供了必要的环境信息
          required: true
