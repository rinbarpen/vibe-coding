name: Documentation
description: 报告文档缺失、错误或需要改进
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: dropdown
    id: type
    attributes:
      label: 文档问题类型
      options:
        - missing（文档缺失）
        - outdated（文档过时）
        - incorrect（文档有误）
        - improvement（需要改进）
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: 文档位置
      description: 文件路径或 URL
      placeholder: "docs/guide/getting-started.md"
    validations:
      required: true

  - type: textarea
    id: gap
    attributes:
      label: 问题描述
      description: 文档存在什么不足？
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: 建议内容
      description: 你希望看到什么样的内容？
